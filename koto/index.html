<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koto — Tiny Worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(250, 247, 241, 0.86); --line: #d9d3c4; --ink: #1c2232; --muted: #6f7a76; --accent: #d9482b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #eef0f4; color: var(--ink); font: 13px/1.45 Inter, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .brand { position: fixed; left: 28px; top: 24px; pointer-events: none; max-width: 330px; }
    .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .brand h1 { font: italic 400 56px/0.95 'Instrument Serif', serif; margin: 6px 0 10px; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .panel { position: fixed; right: 18px; bottom: 18px; width: 272px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .panel h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .seg { display: flex; flex-wrap: wrap; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1 0 25%; border: 0; background: transparent; font: 500 11px Inter, sans-serif; color: var(--ink); padding: 6px 0; cursor: pointer; }
    .seg button:not(:first-child) { border-left: 1px solid var(--ink); }
    .seg button.on { background: var(--ink); color: #fff; }
    .scenes a { flex: 1 0 50%; text-align: center; padding: 7px 0; font: 600 11.5px Inter, sans-serif; text-decoration: none; color: var(--ink); }
    .scenes a:nth-child(2n) { border-left: 1px solid var(--ink); } .scenes a:nth-child(n+3) { border-top: 1px solid var(--ink); }
    .scenes a.on { background: var(--accent); color: #fff; }
    .hint { font-size: 11px; color: var(--muted); }
    .follow { font-size: 11.5px; border-left: 2px solid var(--accent); padding-left: 8px; }
    .story { font-size: 11.5px; border-left: 2px solid #c9a24a; padding-left: 8px; }
    .story a[hidden] { display: none; }
    .story a { display: block; margin-top: 6px; color: #b5452b; font-weight: 600; text-decoration: none; }
    a { color: inherit; }
    @media (max-width: 720px) { .brand h1 { font-size: 40px; } .brand p { display: none; } .panel { left: 12px; right: 12px; width: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="brand">
    <div class="eyebrow" data-en="Tiny Worlds 03 · Temple approach">Tiny Worlds 03 · 参道と境内</div>
    <h1>Koto<span>.</span></h1>
    <p data-en="An imaginary old capital, part Kyoto, part Kamakura. Climb the stone-paved approach and pass through the gate into the temple grounds: worshippers, school trips, rickshaws, a monk sweeping. Change the season and the time of day.">京都と鎌倉を混ぜた架空の古都。石畳の坂の参道を上り、山門をくぐると寺の境内です。参拝する人、修学旅行の列、人力車、掃除をするお坊さん。季節と時間を切り替えられます。</p>
  </div>
  <aside class="panel">
    <div class="seg" id="lang"><button data-v="ja">日本語</button><button data-v="en">English</button></div>
    <div class="seg scenes"><a href="./" class="on" data-en="Approach &amp; temple">参道と境内</a><a href="./lane.html" data-en="Geisha lanes">花街の路地</a><a href="./yama.html" data-en="Bamboo &amp; Inari">竹林と稲荷</a><a href="./umi.html" data-en="Sea &amp; Buddha">海と大仏</a></div>
    <h3 data-en="Views">見る場所</h3>
    <div class="seg" id="views"></div>
    <h3 data-en="Season · Time">季節 · 時間</h3>
    <div class="seg" id="seasons"></div>
    <div class="seg" id="time"><button data-v="day" class="on" data-en="Day">昼</button><button data-v="dusk" data-en="Dusk">夕方</button><button data-v="night" data-en="Night">夜</button></div>
    <div class="follow"><b data-en="Follow a visitor">参拝について行く</b> <span id="followLine" data-en="Follow one visitor round the temple.">ひとりの参拝を追いかけます。</span>
      <div class="seg" style="margin-top:6px"><button id="follow" data-en="Follow">ついて行く</button></div></div>
    <div class="story"><b data-en="Story: Hana and Grandma">物語：ハナとおばあちゃん</b> <span id="storyTitle"></span><br><span id="storyLine" data-en="A day in the old capital, in kimono.">着物で古都をめぐる一日。</span>
      <div class="seg" style="margin-top:6px"><button id="storyBtn" data-en="Watch the story">物語を見る</button></div><a id="storyNext" hidden></a></div>
    <div class="hint" data-en="Drag to orbit · scroll to zoom · <a href=&quot;./parts.html&quot;>Koto parts</a> · <a href=&quot;../&quot;>Tiny Worlds</a>">ドラッグで回転 · ホイールでズーム · <a href="./parts.html">古都のパーツ</a> · <a href="../">Tiny Worlds</a></div>
  </aside>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
