<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Naha — Sea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(250, 247, 241, 0.86); --line: #d9d3c4; --ink: #1c2232; --muted: #6f7a76; --accent: #2fb8bf; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9f1ee; color: var(--ink); font: 13px/1.45 Inter, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .brand { position: fixed; left: 28px; top: 24px; pointer-events: none; max-width: 320px; }
    .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .brand h1 { font: italic 400 56px/0.95 'Instrument Serif', serif; margin: 6px 0 10px; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .panel { position: fixed; right: 18px; bottom: 18px; width: 260px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .panel h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    label { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; font-size: 12px; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .seg { display: flex; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1; border: 0; background: transparent; font: 500 11px Inter, sans-serif; color: var(--ink); padding: 6px 0; cursor: pointer; }
    .seg button + button { border-left: 1px solid var(--ink); }
    .seg button.on { background: var(--ink); color: #fff; }
    .hint { font-size: 11px; color: var(--muted); }
    .event { font-size: 11px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
    .event.live { color: var(--ink); border-color: var(--accent); }
    a { color: inherit; }
    @media (max-width: 720px) { .brand h1 { font-size: 40px; } .brand p { display: none; } .panel { left: 12px; right: 12px; width: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="brand">
    <div class="eyebrow">Tiny Worlds 02 · Sea prototype</div>
    <h1>Naha<span>.</span></h1>
    <p>那覇の海の試作です。白い砂浜から浅瀬、サンゴ礁、外洋への崖まで、すみかごとに海の生き物が暮らしています。水面をクリックすると波紋が広がり、近くの魚が驚きます。</p>
  </div>
  <aside class="panel">
    <h3>見る場所</h3>
    <div class="seg" id="views"><button data-v="all" class="on">全体</button><button data-v="lagoon">浅瀬</button><button data-v="reef">サンゴ礁</button><button data-v="outside">外洋</button><button data-v="cut">断面</button></div>
    <div class="hint" id="seaCount"></div>
    <div class="event" id="event"></div>
    <h3>水の調整</h3>
    <label>波の高さ <input id="wave" type="range" min="0" max="2.5" step="0.05" value="1" /></label>
    <label>透明度 <input id="clarity" type="range" min="0" max="1" step="0.02" value="0.6" /></label>
    <label>光の網目 <input id="caustic" type="range" min="0" max="2.5" step="0.05" value="1" /></label>
    <div class="seg" id="look"><button data-v="day" class="on">昼</button><button data-v="dusk">夕方</button></div>
    <div class="hint">ドラッグで回転 · ホイールでズーム · 水面クリックで波紋 · <a href="../">Tiny Worlds</a></div>
  </aside>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
