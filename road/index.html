<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Naha Road — Tiny Worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(250, 247, 241, 0.88); --line: #d9d3c4; --ink: #1c2232; --muted: #6f7a76; --accent: #e8673c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e4eee9; color: var(--ink); font: 13px/1.45 Inter, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .labels { position: absolute; inset: 0; }
    .tag { background: var(--ink); color: #fff; font: 600 11px Inter, sans-serif; padding: 3px 8px; border-radius: 10px; white-space: nowrap; transform: translateY(-8px); }
    .tag small { font-weight: 400; opacity: 0.7; margin-left: 5px; }
    .brand { position: fixed; left: 28px; top: 24px; pointer-events: none; max-width: 360px; }
    .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .brand h1 { font: italic 400 52px/0.95 'Instrument Serif', serif; margin: 6px 0 10px; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .panel { position: fixed; right: 18px; bottom: 18px; width: 300px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .panel h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .row { display: flex; flex-wrap: wrap; gap: 4px; }
    .row button { flex: 1 0 auto; min-width: 32px; border: 1px solid var(--ink); background: transparent; border-radius: 8px; font: 500 11px Inter, sans-serif; color: var(--ink); padding: 6px 7px; cursor: pointer; }
    .row button.on { background: var(--ink); color: #fff; }
    #storyText { font-size: 12.5px; min-height: 2.9em; border-left: 2px solid var(--accent); padding-left: 8px; }
    #section { font-size: 11px; color: var(--muted); }
    #link[hidden] { display: none; }
    #link { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; border-radius: 9px; padding: 9px; }
    .hint { font-size: 11px; color: var(--muted); }
    a { color: inherit; }
    @media (max-width: 720px) { .brand h1 { font-size: 38px; } .brand p { display: none; } .panel { left: 12px; right: 12px; width: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="brand">
    <div class="eyebrow">Tiny Worlds · 空港から海へ</div>
    <h1>Naha Road<span>.</span></h1>
    <p>那覇空港からビーチまでの道。モノレール、国道の信号、住宅地、サトウキビ畑、そして坂の上から海が見えます。ハナの一家のレンタカーを追いかけられます。</p>
  </div>
  <aside class="panel">
    <h3>ハナの一家</h3>
    <div class="row" id="legs"><button data-leg="out">行き（空港 → 海）</button><button data-leg="back">帰り（海 → 空港）</button></div>
    <div id="storyText">「行き」か「帰り」を押すと、ハナの一家の旅が始まります。</div>
    <a id="link" hidden></a>
    <h3>見る場所</h3>
    <div class="row" id="views"><button data-v="all">全体</button><button data-v="drive">ドライブ</button></div>
    <div id="section"></div>
    <div class="hint">ドラッグで回転 · ホイールでズーム · <a href="../airport/">空港</a> · <a href="../naha/">那覇の海</a> · <a href="../">Tiny Worlds</a></div>
  </aside>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
