<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Market — Tiny Worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(24, 27, 48, 0.82); --line: #3a3f62; --ink: #f2ede4; --muted: #a9a6bd; --accent: #ff7a4a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2440; color: var(--ink); font: 13px/1.45 Inter, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #app canvas { cursor: pointer; }
    .brand { position: fixed; left: 28px; top: 24px; pointer-events: none; max-width: 360px; text-shadow: 0 1px 12px rgba(0, 0, 0, .35); }
    .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .brand h1 { font: italic 400 56px/0.95 'Instrument Serif', serif; margin: 6px 0 10px; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 0; color: #d8d4e6; font-size: 12px; }
    .panel { position: fixed; right: 18px; bottom: 18px; width: 284px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .panel h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .seg { display: flex; flex-wrap: wrap; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1 0 30%; border: 0; background: transparent; font: 500 11px Inter, sans-serif; color: var(--ink); padding: 6px 0; cursor: pointer; }
    .seg button:not(:first-child) { border-left: 1px solid var(--ink); }
    #views button:nth-child(4) { border-left: 0; }
    #views button:nth-child(n+4) { border-top: 1px solid var(--ink); }
    .seg button.on { background: var(--ink); color: #1d2440; }
    .follow, .story { font-size: 11.5px; border-left: 2px solid var(--accent); padding-left: 8px; }
    .story a[hidden] { display: none; }
    .story a { display: block; margin-top: 6px; color: var(--accent); font-weight: 600; text-decoration: none; }
    .hint { font-size: 11px; color: var(--muted); }
    a { color: inherit; }
    @media (max-width: 720px) { .brand { left: 16px; top: 16px; } .brand h1 { font-size: 40px; } .brand p { display: none; } .panel { left: 12px; right: 12px; width: auto; } .follow { display: none; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="brand">
    <div class="eyebrow" data-en="Tiny Worlds · Bangkok night market">Tiny Worlds · バンコクの夜市</div>
    <h1>Yaowarat<span>.</span></h1>
    <p data-en="A night of street food in Bangkok. Shophouses hung with neon signs, stalls along both pavements, tuk-tuks in the road, and through the arch a lane of coloured tents. Over two minutes dusk turns to night: the signs come on one by one and the stalls open.">バンコクの屋台の夜。ネオン看板の下がるショップハウス、歩道にずらりと並ぶ屋台、車道のトゥクトゥク。アーチをくぐると色とりどりのテントの路地。2分のあいだに夕方が夜になり、看板が順に灯って屋台が開いていく。</p>
  </div>
  <aside class="panel">
    <div class="seg" id="lang"><button data-v="ja">日本語</button><button data-v="en">English</button></div>
    <h3 data-en="Views">見る場所</h3>
    <div class="seg" id="views"></div>
    <h3 data-en="Time">時間</h3>
    <div class="seg" id="clock"><button data-v="auto" data-en="Dusk → night">夕方 → 夜</button><button data-v="dusk" data-en="Dusk">夕方</button><button data-v="night" data-en="Night">夜</button></div>
    <div id="time" hidden></div>
    <div class="follow"><b data-en="Follow someone">人について行く</b> <span id="followLine"></span>
      <div class="seg" style="margin-top:6px"><button id="followAny" data-en="Anyone">だれかについて行く</button></div></div>
    <div class="story"><b data-en="Story: Noi, the pad thai stall's daughter">物語：パッタイ屋の娘ノーイ</b> <span id="storyTitle"></span><br><span id="storyLine" data-en="Every evening Noi and her father push their cart out onto Yaowarat Road.">毎晩、ノーイは父と屋台車を押してヤワラート通りに出る。</span>
      <div class="seg" style="margin-top:6px"><button id="storyBtn" data-en="Watch the story">物語を見る</button></div><a id="storyNext" hidden></a></div>
    <div class="hint" data-en="Drag to orbit · scroll to zoom · click a person · <a href=&quot;./parts.html&quot;>Parts</a> · <a href=&quot;../&quot;>Tiny Worlds</a>">ドラッグで回転 · ホイールでズーム · 人をクリック · <a href="./parts.html">パーツ</a> · <a href="../">Tiny Worlds</a></div>
  </aside>
  <script type="module" src="./src/market.js"></script>
</body>
</html>
