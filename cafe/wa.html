<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>喫茶あめつち — Tiny Worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(250, 246, 238, 0.86); --line: #ddd2bf; --ink: #2b2a28; --muted: #7a7266; --accent: #c9714a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e4dc; color: var(--ink); font: 13px/1.45 Inter, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .brand { position: fixed; left: 28px; top: 24px; pointer-events: none; max-width: 340px; }
    .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .brand h1 { font: italic 400 56px/0.95 'Instrument Serif', serif; margin: 6px 0 10px; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .panel { position: fixed; right: 18px; bottom: 18px; width: 276px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .panel h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .seg { display: flex; flex-wrap: wrap; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1 0 25%; border: 0; background: transparent; font: 500 11px Inter, sans-serif; color: var(--ink); padding: 6px 0; cursor: pointer; }
    .seg button:not(:first-child) { border-left: 1px solid var(--ink); }
    .seg button.on { background: var(--ink); color: #fff; }
    .scenes a, .scenes span { flex: 1; text-align: center; padding: 7px 0; font: 600 11.5px Inter, sans-serif; text-decoration: none; color: var(--ink); }
    .scenes span { color: var(--muted); font-weight: 500; }
    .scenes > * + * { border-left: 1px solid var(--ink); }
    .scenes a.on { background: var(--accent); color: #fff; }
    .weather { font-size: 11.5px; color: var(--muted); }
    .story { font-size: 11.5px; border-left: 2px solid #c9714a; padding-left: 8px; }
    .story a[hidden] { display: none; }
    .story a { display: block; margin-top: 6px; color: #b5452b; font-weight: 600; text-decoration: none; }
    .hint { font-size: 11px; color: var(--muted); }
    a { color: inherit; }
    @media (max-width: 720px) { .brand h1 { font-size: 40px; } .brand p { display: none; } .panel { left: 12px; right: 12px; width: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="brand">
    <div class="eyebrow">Tiny Worlds 04 · Cozy Café</div>
    <h1>Ametsuchi<span>.</span></h1>
    <p data-en="A tearoom in an old restored townhouse: lattice windows and a noren curtain, a raised tatami room, a single-slab table. Behind the glass is a tiny courtyard garden where rain wets the moss and the stone lantern, and rings spread on the water basin. Hojicha lattes, matcha and dorayaki.">古い町家を直した喫茶。格子窓と暖簾、小上がりの畳、一枚板の机。奥のガラスの向こうは坪庭で、雨が苔と石灯籠をぬらし、つくばいに波紋が広がる。ほうじ茶ラテと抹茶、どら焼き。</p>
  </div>
  <aside class="panel">
    <div class="seg" id="lang"><button data-v="ja">日本語</button><button data-v="en">English</button></div>
    <div class="seg scenes"><a href="./nordic.html" data-en="Nordic">北欧</a><a href="./wa.html" class="on" data-en="Japanese">和</a><a href="./barcelona.html" data-en="Barcelona">バルセロナ</a></div>
    <h3 data-en="Views">見る場所</h3>
    <div class="seg" id="views"></div>
    <h3 data-en="Weather · Season · Time">天気 · 季節 · 時間</h3>
    <div class="seg" id="weather"><button data-v="auto" class="on" data-en="Auto">自動</button><button data-v="clear" data-en="Clear">晴れ</button><button data-v="drizzle" data-en="Drizzle">小雨</button><button data-v="rain" data-en="Pouring">本降り</button></div>
    <div class="weather" id="weatherLine"></div>
    <div class="seg" id="seasons"></div>
    <div class="seg" id="time"><button data-v="morning" data-en="Morning">朝</button><button data-v="day" class="on" data-en="Day">昼</button><button data-v="dusk" data-en="Dusk">夕方</button><button data-v="night" data-en="Night">夜</button></div>
    <div class="seg"><button id="drift" data-en="Drift">ぼんやり見る</button><button id="sound" data-en="Sound · OFF">音 · OFF</button></div>
    <div class="story"><b data-en="Story: Mina, a travelling illustrator, on a rainy day">物語：旅するイラストレーター・ミナの雨の日</b> <span id="storyTitle"></span><br><span id="storyLine" data-en="Mina travels with a sketchbook. When it rains, she ducks into a café and draws what she sees through the window.">スケッチブックを持って旅するミナ。雨の日にはカフェに入って、窓の外を描きます。</span>
      <div class="seg" style="margin-top:6px"><button id="storyBtn" data-en="Watch the story">物語を見る</button></div><a id="storyNext" hidden></a></div>
    <div class="hint" data-en="Drag to orbit · scroll to zoom · <a href=&quot;../&quot;>Tiny Worlds</a>">ドラッグで回転 · ホイールでズーム · <a href="../">Tiny Worlds</a></div>
  </aside>
  <script type="module" src="./src/wa.js"></script>
</body>
</html>
