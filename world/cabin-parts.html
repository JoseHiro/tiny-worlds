<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>In-flight Parts — Tiny Worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f1ece3;
      --card: #ebe4d8;
      --line: #d9d0c1;
      --ink: #1c2232;
      --muted: #7a7366;
      --accent: #e8673c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 Inter, system-ui, sans-serif;
    }
    #stage {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
    }
    header { padding: 40px 32px 8px; max-width: 1400px; margin: 0 auto; }
    .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    h1 { font: italic 400 56px/1 'Instrument Serif', serif; margin: 6px 0 10px; }
    h1 span { color: var(--accent); }
    .lede { color: var(--muted); max-width: 560px; margin: 0; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 0; }
    .sw { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding: 3px 8px 3px 3px; border: 1px solid var(--line); border-radius: 99px; }
    .sw i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.08); }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .filters button.on { background: var(--ink); color: var(--bg); }
    .moods { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .moods span { margin-right: 4px; letter-spacing: .1em; text-transform: uppercase; }
    .lang { position: fixed; right: 18px; top: 18px; z-index: 3; display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
    .lang button { border: 0; padding: 6px 9px; }
    main {
      max-width: 1400px; margin: 0 auto; padding: 24px 32px 64px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; cursor: pointer; transition: border-color .15s;
    }
    .card:hover { border-color: var(--ink); }
    .card.wide { grid-column: 1 / -1; }
    .view { aspect-ratio: 4 / 3; }
    .card.wide .view { aspect-ratio: 21 / 8; }
    .meta { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
    .meta b { font-weight: 600; }
    .meta small { display: block; color: var(--muted); font-size: 11px; }
    .tag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: block; }
    #detail {
      position: fixed; inset: 0; z-index: 1; background: var(--bg);
      display: none; grid-template-columns: 1fr 300px;
    }
    #detail.open { display: grid; }
    #detailView { position: relative; }
    #detail aside { border-left: 1px solid var(--line); padding: 32px 24px; display: flex; flex-direction: column; gap: 14px; }
    #detail h2 { font: italic 400 40px/1 'Instrument Serif', serif; margin: 0; }
    #detail p { color: var(--muted); margin: 0; }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      font: 500 12px Inter, sans-serif; color: var(--ink); background: transparent;
      border: 1px solid var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer;
    }
    button.on { background: var(--ink); color: var(--bg); }
    .hint { font-size: 11px; color: var(--muted); margin-top: auto; }
    @media (max-width: 720px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      h1 { font-size: 42px; }
      .card.wide .view { aspect-ratio: 4 / 3; }
      #detail { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      #detail aside { border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="lang" id="lang"><button data-v="ja">日本語</button><button data-v="en">EN</button></div>
  <header>
    <div class="eyebrow" data-en="Tiny Worlds · In-flight design kit v0.1">Tiny Worlds · 機内デザインキット v0.1</div>
    <h1>In-flight <span>&amp;</span> Cabin</h1>
    <p class="lede" data-en="Parts for the cabin of a wide-body with three classes (business pods, premium economy, economy 3-3-3), cut open like a doll's house. Made at person scale (a character is 1.3 tall); +X is the nose. Click a card to look closely and try what moves. &lt;a href=&quot;./CABIN.md&quot; style=&quot;color:var(--accent)&quot;&gt;Design notes →&lt;/a&gt;　&lt;a href=&quot;./flight.html&quot; style=&quot;color:var(--muted)&quot;&gt;The flight&lt;/a&gt;　&lt;a href=&quot;../index.html&quot; style=&quot;color:var(--muted)&quot;&gt;Tiny Worlds&lt;/a&gt;">ワイドボディ3クラス（ビジネス個室・プレエコ・エコノミー3-3-3）の客室パーツです。天井を外したドールハウスの見せ方で、人の縮尺（キャラクター＝高さ1.3）で作っています。+X が機首。カードをクリックすると、近くで見たり動くところを試したりできます。<a href="./CABIN.md" style="color:var(--accent)">設計書 →</a>　<a href="./flight.html" style="color:var(--muted)">フライト</a>　<a href="../index.html" style="color:var(--muted)">Tiny Worlds</a></p>
    <div class="filters" id="filters"></div>
    <div class="moods" id="moods"></div>
  </header>
  <main id="grid"></main>
  <section id="detail">
    <div id="detailView"></div>
    <aside>
      <div class="eyebrow" id="dTag"></div>
      <h2 id="dName"></h2>
      <p id="dNote"></p>
      <div class="btns" id="dBtns"></div>
      <div class="hint" data-en="Drag to turn · wheel / pinch to zoom · Esc to go back">ドラッグで回転 · ホイール / ピンチでズーム · Esc で戻る</div>
      <button id="close" data-en="← Back to the list">← 一覧に戻る</button>
    </aside>
  </section>
  <script type="module" src="./src/cabin-gallery.js"></script>
</body>
</html>
