<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Late Commit — Tiny Worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(24, 28, 42, 0.78); --line: #343a52; --ink: #f1ece3; --muted: #a7a2b4; --accent: #ff6ca8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #121624; color: var(--ink); font: 13px/1.45 Inter, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .brand { position: fixed; left: 28px; top: 24px; pointer-events: none; max-width: 360px; }
    .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .brand h1 { font: italic 400 56px/0.95 'Instrument Serif', serif; margin: 6px 0 10px; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .panel { position: fixed; right: 18px; bottom: 18px; width: 260px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .panel h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .seg { display: flex; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1; border: 0; background: transparent; font: 500 11px Inter, sans-serif; color: var(--ink); padding: 6px 0; cursor: pointer; }
    .seg button:not(:first-child) { border-left: 1px solid var(--ink); }
    .seg button.on { background: var(--ink); color: #121624; }
    .hint { font-size: 11px; color: var(--muted); }
    .story { font-size: 12px; border-left: 2px solid var(--accent); padding-left: 9px; min-height: 52px; }
    #fade { position: fixed; inset: 0; background: #05060a; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
    a { color: inherit; }
    @media (max-width: 720px) { .brand h1 { font-size: 40px; } .brand p { display: none; } .panel { left: 12px; right: 12px; width: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="brand">
    <div class="eyebrow">Tiny Worlds 06 · Engineer's room</div>
    <h1>Late commit<span>.</span></h1>
    <p data-en="A rainy night in a Tokyo one-room flat. Someone coding over coffee, a cat asleep on the bed.">雨の夜、東京のワンルーム。コーヒーを飲みながらコードを書く人と、ベッドで眠る猫。</p>
  </div>
  <aside class="panel">
    <div class="seg" id="lang"><button data-v="ja">日本語</button><button data-v="en">English</button></div>
    <h3 data-en="Views">見る場所</h3>
    <div class="seg" id="views"></div>
    <div class="story"><b data-en="Story: the bug on a rainy night">物語：雨の夜のバグ</b><br><span id="storyLine" data-en="Late at night, a test that won’t pass. A cat, a coffee, and one line.">深夜、どうしても通らないテスト。猫と、コーヒーと、一行の話。</span></div>
    <div class="seg"><button id="storyBtn" data-en="Watch the story">物語を見る</button></div>
    <div class="hint" data-en="Drag to orbit · scroll to zoom · <a href=&quot;./sample.html&quot;>Desk sample</a> · <a href=&quot;../&quot;>Tiny Worlds</a>">ドラッグで回転 · ホイールでズーム · <a href="./sample.html">机のサンプル</a> · <a href="../">Tiny Worlds</a></div>
  </aside>
  <div id="fade"></div>
  <script type="module" src="./src/room.js"></script>
</body>
</html>
