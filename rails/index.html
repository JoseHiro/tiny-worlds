<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rush Hour — Tiny Worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(251, 250, 246, 0.84); --line: #d6d2c8; --ink: #1f2430; --muted: #6a6f7a; --accent: #80c241; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f2; color: var(--ink); font: 13px/1.45 Inter, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .brand { position: fixed; left: 28px; top: 24px; pointer-events: none; max-width: 380px; }
    .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .brand h1 { font: italic 400 56px/0.95 'Instrument Serif', serif; margin: 6px 0 10px; }
    .brand h1 span { color: var(--accent); }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .lines { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--ink); }
    .lines i, .ride i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .panel { position: fixed; right: 18px; bottom: 18px; width: 272px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .panel h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .seg { display: flex; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1; border: 0; background: transparent; font: 500 11px Inter, sans-serif; color: var(--ink); padding: 6px 0; cursor: pointer; }
    .seg button:not(:first-child) { border-left: 1px solid var(--ink); }
    .seg button.on { background: var(--ink); color: #fbfaf6; }
    #views { display: grid; grid-template-columns: repeat(3, 1fr); }
    #views button { border-left: 0 !important; border-top: 1px solid var(--ink); }
    #views button:nth-child(-n+3) { border-top: 0; }
    #views button:not(:nth-child(3n+1)) { border-left: 1px solid var(--ink) !important; }
    .clock { font: 600 28px/1 Inter, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    .clock small { font: 500 10px Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
    .ride { font-size: 12px; border-left: 2px solid var(--accent); padding-left: 9px; }
    .ride span { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
    .story { font-size: 12px; border-left: 2px solid #f15a22; padding-left: 9px; min-height: 52px; }
    .hint { font-size: 11px; color: var(--muted); }
    a { color: inherit; }
    @media (max-width: 720px) { .brand h1 { font-size: 40px; } .brand p, .lines { display: none; } .panel { left: 12px; right: 12px; width: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="brand">
    <div class="eyebrow">Tiny Worlds 07 · Tokyo by rail</div>
    <h1>Rush hour<span>.</span></h1>
    <p data-en="Tokyo's rail network as a model railway, on a weekday morning from 7:30 to 9:00. Every train keeps to the timetable; queues form at the door marks and melt into each train.">鉄道模型の東京。平日の朝 7:30〜9:00。電車はみんな時刻表どおりに走り、ホームではドアの位置に列ができては電車に吸いこまれていく。</p>
    <div class="lines"><span><i style="background:#80c241"></i><span data-en="Yamanote">山手線</span></span><span><i style="background:#f15a22"></i><span data-en="Chūō Rapid">中央線快速</span></span><span><i style="background:#ffd400"></i><span data-en="Chūō-Sōbu Local">中央・総武線各駅停車</span></span></div>
  </div>
  <aside class="panel">
    <div class="seg" id="lang"><button data-v="ja">日本語</button><button data-v="en">English</button></div>
    <div class="clock"><span id="clock">7:30</span><small data-en="Game time">ゲーム内の時刻</small></div>
    <div class="ride" id="ride" hidden></div>
    <div class="story"><b data-en="Story: the first morning">物語：はじめての朝</b><br><span id="storyLine" data-en="Sora’s first day at a new job: the Chūō Line from Shinjuku, the Yamanote Line from Tokyo.">新しい会社への初出勤。新宿から中央線、東京から山手線で。</span></div>
    <div class="seg"><button id="storyBtn" data-en="Watch the story">物語を見る</button></div>
    <h3 data-en="Views">見る場所</h3>
    <div class="seg" id="views"></div>
    <div class="hint" data-en="Click a train to ride along · drag to orbit · scroll to zoom · <a href=&quot;./sample.html&quot;>One station</a> · <a href=&quot;../&quot;>Tiny Worlds</a>">電車をクリックで乗る · ドラッグで回転 · ホイールでズーム · <a href="./sample.html">駅ひとつのサンプル</a> · <a href="../">Tiny Worlds</a></div>
  </aside>
  <script type="module" src="./src/rails.js"></script>
</body>
</html>
