<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fuji Mart — Tiny Worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(251, 250, 246, 0.84); --line: #d6d2c8; --ink: #1f2430; --muted: #5d6170; --accent: #2f55c4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a7a9d6; color: var(--ink); font: 13px/1.45 Inter, system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .brand { position: fixed; left: 28px; top: 24px; pointer-events: none; max-width: 340px; }
    .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #39405a; }
    .brand h1 { font: italic 400 56px/0.95 'Instrument Serif', serif; margin: 6px 0 10px; color: #fdfbf4; }
    .brand p { margin: 0; color: #39405a; font-size: 12px; }
    .panel { position: fixed; right: 18px; bottom: 18px; width: 260px; background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .panel h3 { margin: 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    .seg { display: flex; flex-wrap: wrap; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1 1 45%; border: 0; background: transparent; font: 500 11px Inter, sans-serif; color: var(--ink); padding: 6px 0; cursor: pointer; }
    .seg button.on { background: var(--ink); color: #fbfaf6; }
    .hint { font-size: 11px; color: var(--muted); }
    a { color: inherit; }
    @media (max-width: 720px) { .brand h1 { font-size: 40px; } .brand p { display: none; } .panel { left: 12px; right: 12px; width: auto; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="brand">
    <div class="eyebrow">Tiny Worlds 08</div>
    <h1>Fuji Mart</h1>
    <p data-en="A corner shop lit up at dusk, with Mt Fuji turning pink behind its roof.">夕暮れに灯るコンビニと、屋根のうしろで桃色に染まる富士山。</p>
  </div>
  <aside class="panel">
    <div class="seg" id="lang"><button data-v="ja">日本語</button><button data-v="en">English</button></div>
    <h3 data-en="Views">見る場所</h3>
    <div class="seg" id="views"></div>
    <div class="hint" data-en="Drag to orbit · scroll to zoom · <a href=&quot;../&quot;>Tiny Worlds</a>">ドラッグで回転 · ホイールでズーム · <a href="../">Tiny Worlds</a></div>
  </aside>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
